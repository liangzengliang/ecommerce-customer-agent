# ============================================================
# Alembic 主配置文件
# 数据库连接串在 env.py 中通过 settings 动态注入，此处留空
# ============================================================

[alembic]
# 迁移脚本目录
script_location = alembic

# 迁移文件命名模板（时间戳_描述）
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 数据库连接串留空，由 env.py 从 settings 注入
sqlalchemy.url =

# 时区
timezone = Asia/Shanghai

# ============================================================
# 日志配置
# ============================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S