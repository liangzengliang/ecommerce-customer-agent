# ============================================================
# 电商智能客服后端 - pyproject.toml
# 用途：项目元数据、pytest 配置、代码风格工具配置
# ============================================================

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "ecommerce-customer-service-backend"
version = "1.0.0"
description = "电商智能客服后端 - FastAPI + LangGraph + RAG + NLU"
requires-python = ">=3.11"
authors = [
    { name = "Your Name", email = "your@email.com" },
]
keywords = ["fastapi", "langchain", "langgraph", "rag", "nlp", "customer-service"]

# 运行时依赖
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.32.0",
    "python-multipart==0.0.12",

    "sqlalchemy==2.0.36",
    "aiomysql==0.2.0",
    "pymysql==1.1.1",
    "alembic==1.13.3",

    "redis==5.2.0",

    "langchain==1.2.12",
    "langchain-core>=1.6.4,<2.0.0",
    "langgraph==1.1.2",
    "langchain-openai==1.1.1",
    "langchain-redis==0.2.5",
    "langchain-milvus==0.3.3",
    "langchain-text-splitters>=0.3.0",

    "pymilvus>=2.6.0,<3.0.0",
    "tiktoken>=0.7.0,<1.0.0",

    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "email-validator==2.2.0",

    "pydantic==2.10.0",
    "pydantic-core==2.27.0",
    "pydantic-settings==2.6.0",
    "python-dotenv==1.0.1",
    "PyYAML==6.0.2",

    "celery==5.4.0",
    "httpx==0.27.2",
]


[project.optional-dependencies]
# 开发依赖：pip install -e ".[dev]"
dev = [
    "pytest==9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
]


# ============================================================
# pytest 配置（跑测试必须）
# ============================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# 导入路径：同时支持从根目录和 backend/ 目录运行 pytest
# "." = backend/ 目录（让 app 可导入）；".." = 仓库根目录（让 backend 可导入）
pythonpath = [".", ".."]

# pytest 缓存目录：使用项目根目录下可写的 .codex_tmp，避免受保护目录的权限问题
cache_dir = "../.codex_tmp/pytest_cache"

# 关键：让 pytest 自动识别 @pytest.mark.asyncio 的异步测试
asyncio_mode = "auto"

# 常用参数
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

# 自定义标记
markers = [
    "slow: 慢速测试",
    "integration: 需要外部依赖（DB / Redis / Milvus）的集成测试",
    "unit: 纯单元测试",
]


# ============================================================
# 代码风格工具（可选，不影响运行）
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "alembic/versions",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N"]
ignore = [
    "E501",   # 行太长交给 black
    "B008",   # FastAPI Depends 会触发
    "N805",   # pydantic validator 第一个参数必须是 cls
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"alembic/env.py" = ["E402"]


[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | alembic/versions
)/
'''


[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "langgraph.*",
    "langchain_*",
    "pymilvus.*",
]
ignore_missing_imports = true
