# ============================================================
# 生产环境编排
# 包含：MySQL + Redis + Milvus + 后端 + 前端 + Nginx
# 适用：全新部署，不依赖外部服务
# ============================================================

services:
  # ---------- MySQL ----------
  mysql:
    image: mysql:8.0
    container_name: cs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-customer_service}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cs-network

  # ---------- Redis ----------
  redis:
    image: redis:7.2-alpine
    container_name: cs-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-YOUR_REDIS_PASSWORD} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-YOUR_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cs-network

  # ---------- Milvus（含依赖 etcd + minio）----------
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: cs-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - cs-network

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: cs-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - cs-network

  milvus:
    image: milvusdb/milvus:v2.6.3
    container_name: cs-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      common.security.authorizationEnabled: "false"
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_HTTP_PORT:-9091}:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    networks:
      - cs-network

  # ---------- 后端 ----------
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: cs-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+aiomysql://root:${MYSQL_PASSWORD:-root123}@mysql:3306/${MYSQL_DATABASE:-customer_service}
      REDIS_URL: redis://:${REDIS_PASSWORD:-YOUR_REDIS_PASSWORD}@redis:6379/0
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      MILVUS_COLLECTION: ecommerce_knowledge

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.siliconflow.cn/v1}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}

      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${OPENAI_API_KEY}}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-${OPENAI_BASE_URL}}

      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440

      TZ: Asia/Shanghai
    volumes:
      - ../knowledge_base:/knowledge_base:ro
      - ../logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - cs-network

  # ---------- Celery Worker ----------
  celery-worker:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: cs-celery
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: mysql+aiomysql://root:${MYSQL_PASSWORD:-root123}@mysql:3306/${MYSQL_DATABASE:-customer_service}
      REDIS_URL: redis://:${REDIS_PASSWORD:-YOUR_REDIS_PASSWORD}@redis:6379/0
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${OPENAI_API_KEY}}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-${OPENAI_BASE_URL}}
      TZ: Asia/Shanghai
    volumes:
      - ../knowledge_base:/knowledge_base:ro
    depends_on:
      - backend
      - redis
    networks:
      - cs-network

  # ---------- 前端 ----------
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    container_name: cs-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - cs-network

# ---------- 卷 ----------
volumes:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:

# ---------- 网络 ----------
networks:
  cs-network:
    driver: bridge